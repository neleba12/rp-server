  #   container_name: postgres_db
  #   restart: always
  #   environment:
  #     POSTGRES_DB: mibasededatos
  #     POSTGRES_USER: usuario_postgres
  #     POSTGRES_PASSWORD: clave_postgres_segura
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data

  # pgadmin:
