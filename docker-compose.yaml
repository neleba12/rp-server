  #   ports:
  #     - "5050:80"
  #   depends_on:
  #     - postgres-db

  # ==========================================
  # 5. BACKEND .NET 8 (WEB API)
  # ==========================================
  # backend-dotnet:
  #   build:
  #     context: ./backend-dotnet
  #     dockerfile: Dockerfile
  #   container_name: api_dotnet
  #   restart: always
  #   ports:
  #     - "5000:8080"
  #   environment:
  #     - ASPNETCORE_ENVIRONMENT=Production
  #     - ConnectionStrings__DefaultConnection=Host=postgres-db;Port=5432;Database=mibasededatos;Username=usuario_postgres;Password=clave_postgres_segura
  #   depends_on:
  #     - postgres-db

  # ==========================================
  # 6. ACCESO REMOTO SEGURO (CLOUDFLARE TUNNEL)
  # ==========================================
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: always
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TOKEN}
    command: tunnel --no-autoupdate run
  # ==========================================
  # 7. PANEL DE CONTROL (PORTAINER)
  # ==========================================
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

# ==========================================
# VOLÚMENES PERSISTENTES
# ==========================================
volumes:
  portainer_data:
  nextcloud_db_data:
  nextcloud_config:
