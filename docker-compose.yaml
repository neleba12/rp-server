version: '3.8'

services:

  # ==========================================
  # 1. NAS / COMPARTICIÓN DE ARCHIVOS (SAMBA)
  # ==========================================
  samba:
    image: dperson/samba
    container_name: nas_samba
    restart: always
    ports:
      - "139:139"
      - "445:445"
    environment:
      - TZ=Europe/Madrid
    volumes:
      - /media/nas/samba:/storage
    command: '-s "NAS_Compartido;/storage;yes;no;no;${SAMBA_USER};none;none;none" -u "${SAMBA_USER};${SAMBA_PASSWORD}"'

  # ==========================================
  # 2. NEXTCLOUD (NUBE PERSONAL)
  # ==========================================
  nextcloud-db:
    image: mariadb:10.11
    container_name: nextcloud_db
    restart: always
    command: --transaction-isolation=READ-COMMITTED --log-bin-trust-function-creators=1
    volumes:
      - nextcloud_db_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=clave_root_mariadb
      - MYSQL_PASSWORD=${NEXTCLOUD_USER_PASSWORD}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud

  nextcloud:
    image: nextcloud:latest
    container_name: nextcloud_app
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - nextcloud-db
    volumes:
      - /media/nas/nextcloud_data:/var/www/html/data
      - nextcloud_config:/var/www/html
    environment:
      - MYSQL_PASSWORD=${NEXTCLOUD_USER_PASSWORD}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_HOST=nextcloud-db

  # ==========================================
  # 3. PÁGINA WEB ESTÁTICA (NGINX)
  # ==========================================
  # mi-web:
  #   image: nginx:alpine
  #   container_name: servidor_web
  #   restart: always
  #   ports:
  #     - "8081:80"
  #   volumes:
  #     - ./sitio-web:/usr/share/nginx/html:ro

